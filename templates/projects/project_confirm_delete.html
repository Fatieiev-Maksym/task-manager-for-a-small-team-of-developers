{% extends "base.html" %}

{% block title %}Видалити проєкт{% endblock %}

{% block content %}
<h1 class="h3">Видалити проєкт</h1>
<p class="text-secondary">
    Ви дійсно хочете видалити проєкт <strong>{{ project.name }}</strong>?
</p>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Видалити</button>
    <a class="btn btn-outline-secondary" href="{% url 'projects:detail' project.pk %}">Скасувати</a>
</form>
{% endblock %}
